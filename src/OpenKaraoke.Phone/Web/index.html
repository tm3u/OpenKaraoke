<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#101419"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="/style.css"><title>OpenKaraoke 手機麥克風</title><script src="/app.js" defer></script></head>
<body><main><header><img src="/logo.svg" width="24" height="24" alt=""><span>OpenKaraoke</span></header><h1>手機麥克風</h1>
<p id="status" role="status" aria-live="polite">正在配對…</p><button id="toggle" class="primary" disabled aria-pressed="false" aria-busy="false" data-state="disabled">開啟麥克風</button><p id="error" role="alert" class="error" hidden></p>
<aside class="mic-mode-note" aria-labelledby="mic-mode-title">
  <h2 id="mic-mode-title">iPhone 請使用「標準」模式</h2>
  <p>避免「自動」或「語音隔離」的額外處理，有助減少延遲。</p>
  <ol>
    <li>先開啟麥克風，再從右上角下滑打開「控制中心」。</li>
    <li>點「Safari 控制項目」（或「麥克風模式」），選擇<strong>「標準」</strong>，再回到此頁面。</li>
  </ol>
</aside>
<p id="screen-status" class="subtle" role="status" aria-live="polite" hidden></p><p class="subtle">最多兩支手機同時收音。麥克風開啟時會要求保持螢幕常亮，請保持此頁面開啟並避免手動鎖屏。</p></main></body></html>
